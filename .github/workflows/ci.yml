name: CI

on:
  pull_request:
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  # ジョブ ID は geckou/kit・geckou/project-starter と揃える
  # （required status check の名前になるため）
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      # リリース時の API 差分検査の回帰テスト。npm レジストリには接続しない
      # （公開物は --published-tarball で差し替える）
      - name: API Diff Guard Test
        run: bash scripts/test-api-diff.sh

      # どこからでも公開できるようにするコマンドの回帰テスト。
      # 偽のリポジトリを作って動かすだけなので node も yarn も要らない
      - name: Release Command Test
        run: bash scripts/test-release-command.sh

      # packages/* の version が、それを参照するワークスペースのレンジを
      # 満たしているか。満たしていないと yarn が npm の旧版を落としてきて、
      # ローカルの変更が使われないまま lint も type-check も通ってしまう
      - name: Workspace Range Check
        run: node scripts/check-workspace-ranges.mjs

      - name: Workspace Range Check Test
        run: bash scripts/test-workspace-ranges.sh

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Type check
        run: yarn type-check

      - name: Test
        run: yarn test

      - name: Build packages
        run: yarn build

      # dist の型定義が packages/core/src を参照していないか
      # （tarball に入らないため、参照が残ると利用側で型が解決できない）
      - name: Check dist types
        run: yarn check:dist-types

      - name: Build demo site
        run: yarn build:demo
