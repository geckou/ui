name: CI

on:
  pull_request:
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # リリース時の API 差分検査の回帰テスト。npm レジストリには接続しない
      # （公開物は --published-tarball で差し替える）
      - name: API Diff Guard Test
        run: bash scripts/test-api-diff.sh

      # どこからでも公開できるようにするコマンドの回帰テスト。
      # 偽のリポジトリを作って動かすだけなので node も yarn も要らない
      - name: Release Command Test
        run: bash scripts/test-release-command.sh

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Type check
        run: yarn type-check

      - name: Test
        run: yarn test

      - name: Build packages
        run: yarn build

      - name: Build demo site
        run: yarn build:demo
