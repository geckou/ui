name: Deprecate package

# 公開済みパッケージに非推奨メッセージを付ける（削除ではない）。
# npm は publish 系の操作に 2FA かバイパス付きトークンを要求するため、
# 手元からではなく CI の NPM_TOKEN で実行する。
on:
  workflow_dispatch:
    inputs:
      package:
        description: '対象パッケージ名。例 @geckou/vue-ui'
        required: true
      message:
        description: '表示する非推奨メッセージ。空文字を渡すと非推奨を解除する'
        required: true

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Deprecate
        run: npm deprecate "$PACKAGE" "$MESSAGE"
        env:
          PACKAGE: ${{ inputs.package }}
          MESSAGE: ${{ inputs.message }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
